<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interview Casefile — 8020IQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --cream:#FAF8F5; --warm-white:#F5F3EF; --charcoal:#18181B;
    --emerald:#10B981; --emerald-dark:#059669;
    --text:#1C1C1E; --text-2:#636366; --text-3:#8E8E93;
    --line:#E8E4DE; --line-strong:#DDD7CE;
    --accent:var(--emerald); --accent-strong:var(--emerald-dark);
    --accent-wash:rgba(16,185,129,0.10); --alert:#DC2626;
    --student:#2563EB; --student-dark:#1D4ED8; --student-wash:#EFF6FF; --student-line:#BFDBFE;
    --coach:#D97706; --coach-dark:#B45309; --coach-wash:#FFFBEB; --coach-line:#FCD34D;
    --handout:#4F46E5; --handout-dark:#4338CA; --handout-wash:#EEF2FF; --handout-line:#C7D2FE;
    --font-display:'DM Sans',-apple-system,sans-serif;
    --font-body:'Inter',-apple-system,sans-serif;
    --font-mono:'JetBrains Mono',Menlo,Consolas,monospace;
    --r-card:16px; --r-pill:9999px;
    --shadow-rest:0 1px 2px rgba(0,0,0,0.04),0 1px 6px rgba(0,0,0,0.04);
    --shadow-hover:0 4px 12px rgba(0,0,0,0.06),0 12px 32px rgba(0,0,0,0.06);
    color-scheme:light;
  }
  * { box-sizing:border-box; }
  html { scroll-behavior:smooth; }
  body { margin:0; background:var(--cream); color:var(--text); font-family:var(--font-body); font-size:16px; line-height:1.6; -webkit-font-smoothing:antialiased; }
  ::selection { background:var(--accent-wash); }
  .wrap { width:100%; min-width:0; max-width:880px; margin:0 auto; padding:0 24px; }
  @media (min-width:768px) { .wrap { padding:0 48px; } }
  h1,h2,h3 { font-family:var(--font-display); font-weight:700; color:var(--text); margin:0; text-wrap:balance; }
  p { margin:0 0 14px; }
  a { color:var(--accent-strong); }
  .eyebrow { font-family:var(--font-mono); font-weight:600; font-size:11px; letter-spacing:0.08em; text-transform:uppercase; color:var(--accent-strong); }
  .topnav { position:sticky; top:0; z-index:50; background:color-mix(in srgb,var(--cream) 86%,transparent); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border-bottom:1px solid var(--line); }
  .nav-inner { display:flex; align-items:center; justify-content:space-between; gap:18px; height:54px; }
  .nav-brand { display:flex; align-items:center; gap:9px; font-family:var(--font-display); font-weight:800; font-size:15px; color:var(--text); text-decoration:none; }
  .nav-brand .iso { width:20px; height:20px; border-radius:50%; background:conic-gradient(from 20deg,var(--accent-strong) 0 75%,rgba(5,150,105,0.35) 75% 100%); -webkit-mask:radial-gradient(circle,transparent 46%,#000 47%); mask:radial-gradient(circle,transparent 46%,#000 47%); }
  .nav-back { font-family:var(--font-mono); font-size:11px; font-weight:600; letter-spacing:0.04em; text-transform:uppercase; color:var(--text-3); text-decoration:none; padding:6px 12px; border-radius:var(--r-pill); }
  .nav-back:hover { color:var(--accent-strong); background:var(--accent-wash); }

  /* ===== gate ===== */
  #gate { min-height:calc(100vh - 54px); display:flex; align-items:center; justify-content:center; padding:40px 24px; }
  .gate-card { width:100%; max-width:420px; background:var(--warm-white); border:1px solid var(--line-strong); border-top:3px solid var(--accent-strong); border-radius:var(--r-card); box-shadow:var(--shadow-hover); padding:34px 34px 30px; text-align:center; }
  .gate-card .lock { width:46px; height:46px; margin:0 auto 16px; border-radius:50%; background:var(--accent-wash); color:var(--accent-strong); display:flex; align-items:center; justify-content:center; font-size:20px; }
  .gate-card h1 { font-size:22px; margin-bottom:6px; }
  .gate-card p { font-size:13.5px; color:var(--text-2); margin-bottom:20px; }
  .gate-card input {
    width:100%; padding:12px 14px; font-family:var(--font-mono); font-size:15px; letter-spacing:0.1em; text-align:center;
    border:1px solid var(--line-strong); border-radius:10px; background:var(--cream); color:var(--text); outline:none;
  }
  .gate-card input:focus { border-color:var(--accent-strong); }
  .gate-card button {
    width:100%; margin-top:12px; padding:12px 14px; cursor:pointer;
    font-family:var(--font-display); font-weight:700; font-size:14.5px;
    background:var(--accent-strong); color:var(--cream); border:none; border-radius:10px;
    transition:transform 0.15s ease, box-shadow 0.15s ease;
  }
  .gate-card button:hover { transform:translateY(-1px); box-shadow:var(--shadow-hover); }
  .gate-err { display:none; margin-top:12px; font-family:var(--font-mono); font-size:12px; color:var(--alert); }
  .gate-err.show { display:block; }

  /* ===== casefile content (injected after unlock) ===== */
  #casefile { display:none; padding-bottom:60px; }
  .case-tabs { position:sticky; top:54px; z-index:40; display:flex; gap:4px; overflow-x:auto; padding:10px 0; margin-bottom:8px; background:var(--cream); border-bottom:1px solid var(--line); }
  .case-tabs a { font-family:var(--font-mono); font-size:11px; font-weight:600; letter-spacing:0.04em; text-transform:uppercase; color:var(--text-3); text-decoration:none; padding:6px 12px; border-radius:var(--r-pill); white-space:nowrap; }
  .case-tabs a:hover { color:var(--accent-strong); background:var(--accent-wash); }
  .case { padding:36px 0 8px; border-bottom:1px solid var(--line); scroll-margin-top:110px; }
  .case:last-of-type { border-bottom:none; }
  .case-head .c-num { font-family:var(--font-mono); font-weight:600; font-size:11px; letter-spacing:0.08em; text-transform:uppercase; color:var(--accent-strong); }
  .case-head h2 { font-size:26px; margin:6px 0 10px; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
  .chip { max-width:100%; font-family:var(--font-mono); font-size:10.5px; font-weight:600; letter-spacing:0.04em; line-height:1.45; text-transform:uppercase; color:var(--accent-strong); background:var(--accent-wash); border-radius:var(--r-pill); padding:4px 12px; white-space:normal; overflow-wrap:anywhere; }
  .ifasked { font-size:13px; color:var(--text-2); margin:0 0 8px; }
  .ifasked b { color:var(--text); }
  .role-card { position:relative; border:1px solid; border-left-width:5px; border-radius:var(--r-card); padding:18px 22px 16px; margin:14px 0; box-shadow:var(--shadow-rest); overflow:hidden; }
  .student-card { background:var(--student-wash); border-color:var(--student-line); border-left-color:var(--student); }
  .coach-card { background:var(--coach-wash); border-color:var(--coach-line); border-left-color:var(--coach); }
  .handout-card { background:var(--handout-wash); border-color:var(--handout-line); border-left-color:var(--handout); }
  .role-label { display:inline-flex; align-items:center; min-height:24px; font-family:var(--font-mono); font-weight:700; font-size:10px; letter-spacing:0.07em; line-height:1.2; text-transform:uppercase; color:#fff; border-radius:var(--r-pill); padding:5px 12px; margin-bottom:10px; }
  .student-card .role-label { background:var(--student); }
  .coach-card .role-label { background:var(--coach); }
  .handout-card .role-label { background:var(--handout); }
  .role-title { font-size:17px; margin:0 0 12px; }
  .student-card .role-title { color:var(--student-dark); }
  .coach-card .role-title { color:var(--coach-dark); }
  .handout-card .role-title { color:var(--handout-dark); }
  .role-card p { font-size:14px; color:var(--text-2); }
  .role-card p:last-child { margin-bottom:0; }
  .role-card p b, .role-card li b { color:var(--text); }
  .role-card ul { padding-left:20px; margin:0 0 12px; color:var(--text-2); font-size:14px; }
  .role-card ul li { margin-bottom:7px; }
  .student-card .owner { font-family:var(--font-display); font-weight:600; font-size:15.5px; color:var(--text); }
  .student-card .ask { font-size:15px; color:var(--text); margin-bottom:2px; }
  .coach-card .coach { color:var(--coach-dark); font-weight:600; }
  .coach-overview { margin-top:12px; }
  .coach-overview .chips { margin:0 0 10px; }
  .coach-overview .chip { color:var(--coach-dark); background:rgba(217,119,6,0.11); }
  .coach-overview .ifasked { margin:0; }
  .facilitator-card { margin-top:18px; }
  .readaloud { position:relative; background:var(--accent-wash); border:1px solid rgba(5,150,105,0.22); border-left:4px solid var(--accent-strong); border-radius:var(--r-card); padding:16px 22px 12px; margin:14px 0 8px; }
  .ra-label { display:inline-block; font-family:var(--font-mono); font-weight:600; font-size:10px; letter-spacing:0.07em; text-transform:uppercase; color:var(--charcoal); background:var(--accent); border-radius:var(--r-pill); padding:4px 12px; margin-bottom:10px; }
  .readaloud p { font-size:14.5px; color:var(--text-2); }
  .readaloud b { color:var(--text); }
  .readaloud .owner { font-family:var(--font-display); font-weight:600; font-size:15.5px; color:var(--text); }
  .q { padding:8px 0 4px; }
  .q h3 { font-size:16.5px; margin-bottom:10px; }
  .q h4 { font-family:var(--font-display); font-size:13.5px; color:var(--text); margin:16px 0 6px; }
  .q code, .facnote code { font-family:var(--font-mono); font-size:0.9em; color:var(--accent-strong); }
  .q .qn { font-family:var(--font-mono); font-weight:600; font-size:11px; letter-spacing:0.06em; color:var(--charcoal); background:var(--accent); border-radius:var(--r-pill); padding:3px 10px; margin-right:8px; vertical-align:2px; }
  .student-card .qn { color:#fff; background:var(--student); }
  .q .ask { font-size:14.5px; color:var(--text-2); }
  .q .ask b { color:var(--text); }
  .q .student-card .ask { font-size:15px; color:var(--text); }
  .q ul { padding-left:20px; margin:0 0 12px; color:var(--text-2); font-size:14px; }
  .q ul li { margin-bottom:7px; }
  .q ul b { color:var(--text); }
  .q p { font-size:14px; color:var(--text-2); }
  .q p b { color:var(--text); }
  .coach { font-family:var(--font-mono); font-size:12px; color:var(--accent-strong); }
  .table-scroll { overflow-x:auto; }
  table.data { width:100%; border-collapse:collapse; margin:12px 0 16px; font-size:13.5px; }
  table.data th { font-family:var(--font-mono); font-size:10.5px; letter-spacing:0.05em; text-transform:uppercase; color:var(--text-2); text-align:left; padding:8px 12px; border-bottom:1px solid var(--line-strong); }
  table.data td { padding:9px 12px; border-bottom:1px solid var(--line); color:var(--text-2); vertical-align:top; }
  table.data tbody tr:nth-child(even) { background:var(--warm-white); }
  td.mono { font-family:var(--font-mono); font-size:12px; color:var(--accent-strong); white-space:nowrap; }
  td.strong { color:var(--text); font-weight:600; }
  td.bad { color:var(--alert); font-weight:600; }
  td.good { color:var(--accent-strong); font-weight:600; }
  .reveal { background:var(--warm-white); border:1px dashed var(--accent-strong); border-radius:12px; padding:14px 18px 8px; margin:12px 0; }
  .rv-label { display:inline-block; font-family:var(--font-mono); font-weight:600; font-size:10px; letter-spacing:0.07em; text-transform:uppercase; color:var(--accent-strong); margin-bottom:8px; }
  .reveal p { font-size:13.5px; color:var(--text-2); }
  .reveal b { color:var(--text); }
  .handout-card .reveal { background:rgba(255,255,255,0.64); border-color:var(--handout); }
  .handout-card .rv-label { color:var(--handout-dark); }
  blockquote.model { margin:12px 0 14px; padding:14px 20px; border-left:3px solid var(--accent-strong); background:var(--warm-white); border-radius:0 12px 12px 0; font-size:14px; color:var(--text-2); font-style:italic; }
  blockquote.model b { color:var(--text); font-style:normal; }
  .facnote { font-family:var(--font-mono); font-size:11.5px; color:var(--text-3); border-top:1px dashed var(--line-strong); padding-top:12px; margin:10px 0 20px; }
  @media (max-width:560px) {
    .wrap { padding-left:16px; padding-right:16px; }
    .role-card { padding:16px 16px 14px; }
    .role-label { white-space:normal; }
  }
  @media print { .topnav, .case-tabs { display:none !important; } .case { break-before:page; } .role-card { box-shadow:none; break-inside:avoid; } }
</style>
</head>

<script>
(function () {
  async function decrypt(pw) {
    var b64 = document.getElementById('payload').textContent.trim();
    var raw = Uint8Array.from(atob(b64), function (c) { return c.charCodeAt(0); });
    var magic = new TextDecoder().decode(raw.slice(0, 8));
    if (magic !== 'Salted__') throw new Error('bad payload');
    var salt = raw.slice(8, 16), data = raw.slice(16);
    var km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
    var bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: salt, iterations: 100000, hash: 'SHA-256' }, km, 384);
    var kb = new Uint8Array(bits);
    var key = await crypto.subtle.importKey('raw', kb.slice(0, 32), { name: 'AES-CBC' }, false, ['decrypt']);
    var out = await crypto.subtle.decrypt({ name: 'AES-CBC', iv: kb.slice(32, 48) }, key, data);
    return new TextDecoder().decode(out);
  }

  function show(html) {
    document.getElementById('caseContent').innerHTML = html;
    document.getElementById('gate').style.display = 'none';
    document.getElementById('casefile').style.display = 'block';
    var target = window.location.hash && document.getElementById(window.location.hash.slice(1));
    if (target) requestAnimationFrame(function () { target.scrollIntoView(); });
  }

  async function attempt(pw, silent) {
    try {
      var html = await decrypt(pw);
      if (html.indexOf('case-tabs') === -1) throw new Error('bad');
      sessionStorage.setItem('cf-pw', pw);
      show(html);
    } catch (e) {
      sessionStorage.removeItem('cf-pw');
      if (!silent) {
        document.getElementById('gateErr').classList.add('show');
        document.getElementById('pw').value = '';
        document.getElementById('pw').focus();
      }
    }
  }

  document.getElementById('gateForm').addEventListener('submit', function (ev) {
    ev.preventDefault();
    attempt(document.getElementById('pw').value, false);
  });

  var saved = sessionStorage.getItem('cf-pw');
  if (saved) attempt(saved, true);
})();
</script>
